<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 탈퇴 - SoulPaw</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='Login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='Withdraw.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='UserEdit.css') }}">
    <style>
        .auth-input-group {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        .auth-input-group input {
            flex: 3;
        }
        .btn-send-code {
            flex: 1;
            background-color: #ff8c00;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            padding: 0 10px;
            white-space: nowrap;
        }
        .btn-send-code:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .spacing-top {
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div id="wrapper">
        <header class="header-area">
        <div class="header-container">
            <div class="logo-text-only" onclick="document.location.href='/Login'">
                SoulPaw</div>
            <div style="text-align : center;" onclick="document.location.href='/Login'">
                <img src="{{ url_for('static', filename='image/soulpaw.png') }}" style="width: 80px;"
                    alt="Soul Paw Image">
            </div>
            <div class="auth-logged-in">
                <span class="user-welcome"><b>{{ US_name }}</b>님 안녕하세요</span>
                <button class="logout-btn" onclick="document.location.href='/Logout'">로그아웃</button>
            </div>
        </header>

        <main class="main-content withdraw-container">
            <section class="withdraw-card">
                <div class="withdraw-header">
                    <div class="warning-icon">⚠️</div>
                    <h2>정말 탈퇴하시겠어요?</h2>
                    <p>
                        계정을 삭제하면 그동안 SoulPaw와 함께한 <br>
                        소중한 추천 기록들이 모두 사라지게 됩니다.
                    </p>
                </div>

                <form id="withdrawForm">
                    <div class="form-group">
                        <label for="user_email">본인 확인 이메일</label>
                        <div class="auth-input-group">
                            <input type="email" name="user_email" id="user_email" placeholder="가입하신 이메일 입력">
                            <button type="button" id="sendCodeBtn" class="btn-send-code" onclick="sendCode()">코드 전송</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="auth_code">인증번호 입력</label>
                        <input type="text" name="auth_code" id="auth_code" placeholder="인증번호 6자리 입력">
                    </div>

                    <div class="form-group">
                        <label>탈퇴 사유를 알려주세요 (선택)</label>
                        <select name="withdraw_reason">
                            <option value="none">사유를 선택해 주세요</option>
                            <option value="service">서비스 이용이 불편해요</option>
                            <option value="content">추천 결과가 만족스럽지 않아요</option>
                            <option value="privacy">개인정보 유출이 걱정돼요</option>
                            <option value="etc">기타</option>
                        </select>
                    </div>

                    <div class="agreement-check">
                        <input type="checkbox" id="agree_withdraw" name="agree_withdraw">
                        <label for="agree_withdraw">위 주의사항을 모두 숙지하였으며, 이에 동의합니다.</label>
                    </div>

                    <div class="withdraw-actions">
                        <button type="button" class="final-withdraw-btn" onclick="confirmWithdraw()">탈퇴하기</button>
                        <button type="button" class="back-btn" style="background-color:#ff8c00; color:white; font-weight:700;" onclick="cancelWithdraw()">마음이 바뀌었어요 (돌아가기)</button>
                    </div>
                </form>
            </section>
        </main>

        <footer class="main-footer">
            <p>Copyright © 2026 SoulPaw All Rights Reserved.</p>
        </footer>
    </div>

    <div id="customAlert" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon">😢</div>
            <h3 id="modalTitle">알림</h3>
            <p id="modalMessage">내용</p>
            <div class="modal-btns" id="modalBtnArea"></div>
        </div>
    </div>

    <script>
        function showModal(title, message, icon, type) {
            const modal = document.getElementById("customAlert");
            document.getElementById("modalTitle").innerText = title;
            document.getElementById("modalMessage").innerText = message;
            document.getElementById("modalIcon").innerText = icon;

            const btnArea = document.getElementById("modalBtnArea");
            btnArea.innerHTML = "";

            if (type === "confirm") {
                btnArea.innerHTML = `
                    <button class="modal-confirm-btn" style="background-color:#ff8c00;" onclick="closeModal()">계속 이용하기</button>
                    <button class="modal-cancel-btn" style="background:none; color:#bbb; text-decoration:underline; cursor:pointer;" onclick="submitWithdraw()">탈퇴 확정</button>
                `;
            } else if (type === "welcomeBack") {
                btnArea.innerHTML = `<button class="modal-confirm-btn" onclick="location.href='/Login'">메인으로 이동</button>`;
            } else {
                btnArea.innerHTML = `<button class="modal-confirm-btn" onclick="closeModal()">확인</button>`;
            }
            modal.classList.add("active");
        }

        function closeModal() {
            document.getElementById("customAlert").classList.remove("active");
        }

        function sendCode() {
            const email = document.getElementById("user_email").value;
            if (!email) {
                showModal("확인 필요", "인증번호를 받을 이메일을 입력해 주세요 🐾", "📧", "error");
                return;
            }

            const btn = document.getElementById("sendCodeBtn");
            btn.disabled = true;
            btn.innerText = "발송 중...";

            const formData = new FormData();
            formData.append('user_email', email);

            fetch('/send_withdraw_code', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.result === 'success') {
                    showModal("발송 완료", "메일함에서 인증번호를 확인해 주세요! 📧", "✅", "info");
                    btn.innerText = "재발송";
                } else {
                    showModal("오류", data.message, "❌", "error");
                    btn.innerText = "코드 전송";
                }
                btn.disabled = false;
            })
            .catch(() => {
                showModal("오류", "서버 통신 실패", "❌", "error");
                btn.disabled = false;
            });
        }

        function confirmWithdraw() {
            const email = document.getElementById("user_email");
            const code = document.getElementById("auth_code");
            const agree = document.getElementById("agree_withdraw");
            
            if (!email.value || !code.value) {
                showModal("입력 확인", "이메일과 인증번호를 모두 입력해 주세요 🐾", "🔒", "error");
                return;
            }

            if (!agree.checked) {
                showModal("동의 확인", "탈퇴 주의사항에 동의해 주세요.", "💡", "error");
                return;
            }

            showModal("정말 떠나시나요? 😢", "회원님과 반려동물들의 소중한 매칭 기록이 모두 사라집니다.", "🐾", "confirm");
        }

        function submitWithdraw() {
            closeModal();
            const form = document.getElementById("withdrawForm");
            const formData = new FormData(form);

            fetch('/Withdraw', {
                method: 'POST',
                body: formData
            })
            .then(res => {
                if (!res.ok) throw new Error('Network response was not ok');
                return res.json();
            })
            .then(data => {
                if (data.result === 'success') {
                    showModal("탈퇴 완료", data.message, "👋", "welcomeBack");
                } else {
                    showModal("오류", data.message, "❌", "error");
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showModal("오류", "서버 처리에 실패했습니다. 주소를 다시 확인해주세요.", "❌", "error");
            });
        }

        function cancelWithdraw() {
            window.history.back();
        }
    </script>
</body>
</html>
